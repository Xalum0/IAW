limit_req_zone $binary_remote_addr zone=patches_by_ip:12m rate=3r/s;

server {
    listen 80;
    server_name patchesmerch.local patchesguides.local;

    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name patchesmerch.local patchesguides.local;

    ssl_certificate /etc/nginx/certs/patchesmerch-lab.crt;
    ssl_certificate_key /etc/nginx/certs/patchesmerch-lab.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256';

    location / {
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;

        limit_req zone=patches_by_ip burst=6 nodelay;
        limit_req_status 429;

        proxy_pass http://apache:8183;
        proxy_set_header Host $host;
    }
}
