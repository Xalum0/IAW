    DocumentRoot /var/www/patchesmerch

    ErrorLog ${APACHE_LOG_DIR}/patchesmerch-error.log
    CustomLog ${APACHE_LOG_DIR}/patchesmerch-access.log combined

    <Directory /var/www/patchesmerch>
        Require all granted
    </Directory>
</VirtualHost>
