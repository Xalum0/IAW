<VirtualHost *:8183>
    ServerName patchesguides.local
    DocumentRoot /var/www/patchesguides

    ErrorLog ${APACHE_LOG_DIR}/patchesguides-error.log
    CustomLog ${APACHE_LOG_DIR}/patchesguides-access.log combined

    <Directory /var/www/patchesguides>
        Options -Indexes
        Require all granted

        <Files "patchesguides-vault.csv">
            Require all denied
        </Files>
    </Directory>
</VirtualHost>
